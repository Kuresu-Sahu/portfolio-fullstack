<!doctype html>
<html lang="en" class="dark scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/profile.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kuresu Sahu — Java Full Stack Developer</title>
  <meta name="description" content="Portfolio of Kuresu Sahu, a senior Java Full Stack Developer engineering modern, scalable web applications with Java, Spring Boot, React, and SQL." />
  <meta name="keywords" content="Kuresu Sahu, Java Full Stack Developer, Software Engineer, Spring Boot, React, MERN, Bangalore" />
  <meta name="author" content="Kuresu Sahu" />

  <!-- Synchronous theme script to prevent any flash on load -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('portfolio-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = savedTheme || (prefersDark ? 'dark' : 'dark');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Kuresu Sahu — Java Full Stack Developer" />
  <meta property="og:description" content="Engineering modern web applications with Java, Spring Boot, React, and SQL." />
  <meta property="og:image" content="/profile.png" />
